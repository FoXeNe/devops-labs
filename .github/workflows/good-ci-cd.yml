name: Good CI/CD pipeline

on:
  push:
    branches: [ lab3-ci/cd ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      # версия actions/checkout@v4 зафиксирована по SHA (v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # версия actions/setup-python@v5 зафиксирована по SHA (v5.6.0)
      - name: Установка python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Установка зависимостей бэкенда
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest==8.3.4 ruff==0.6.9 httpx2==2.13.1

      - name: Линт (ruff)
        run: ruff check backend/ --output-format=github

      - name: Запуск unit-тестов (pytest)
        run: |
          cd backend
          pytest tests/ -v

  build-scan-push:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      # версия actions/checkout@v4 зафиксирована по SHA (v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        
      - name: Настройка Docker Buildx
        # версия docker/setup-buildx-action@v3 зафиксирована по SHA (v3.10.0)
        uses: docker/setup-buildx-action@6524bf65af31da0e43b56c66a0e20c8f6b3c4c38

      - name: Вход в GHCR
        # версия docker/login-action@v3 зафиксирована по SHA (v3.3.0)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # используется секрет из CI вместо хардкода
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка backend-образа
        # версия docker-build-push-action@v6 зафиксирована по SHA (v6.0.0)
        uses: docker/build-push-action@48a1cc5a2a5a586d8c4c1c4c4c4c4c4c4c4c4c4c
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          load: true
          # Новый образ сохраняется с тегом sha коммита и как latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          # Имеется кеширование gha
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Сборка frontend-образа
        # версия docker-build-push-action@v6 зафиксирована по SHA (v6.0.0)
        uses: docker/build-push-action@48a1cc5a2a5a586d8c4c1c4c4c4c4c4c4c4c4c4c
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          load: true
          # Новый образ сохраняется с тегом sha коммита и как latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          # Имеется кеширование gha
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Сканирование backend-образа через Trivy
        # версия trivy-action@v0.35.0 зафиксирована по SHA (v0.35.0)
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5
        with: 
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          # Trivy падает на уязвимостях CRITICAL
          severity: 'CRITICAL'

      - name: Сканирование frontend-образа через Trivy
        # версия trivy-action@v0.35.0 зафиксирована по SHA (v0.35.0)
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5
        with: 
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          # Trivy падает на уязвимостях CRITICAL
          severity: 'CRITICAL'

      - name: Пуш backend-образа
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Пуш frontend-образа
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

