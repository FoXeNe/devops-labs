name: Good CI/CD pipeline

on:
  push:
    branches: [ lab3-ci/cd ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: foxene/devops-labs/backend
  FRONTEND_IMAGE_NAME: foxene/devops-labs/frontend
  RELEASE_STATE_FILE: .deploy/current_release.txt

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      # версия actions/checkout@v4 зафиксирована по SHA (v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # версия actions/setup-python@v5 зафиксирована по SHA (v5.6.0)
      - name: Установка python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Установка зависимостей бэкенда
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest==8.3.4 ruff==0.6.9 httpx2==2.13.1

      - name: Линт (ruff)
        run: ruff check backend/ --output-format=github

      - name: Запуск unit-тестов (pytest)
        run: |
          cd backend
          pytest tests/ -v

  build-scan-push:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      # версия actions/checkout@v4 зафиксирована по SHA (v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        
      - name: Настройка Docker Buildx
        # версия docker/setup-buildx-action@v4 зафиксирована по SHA (v4.4.1)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Вход в GHCR
        # версия docker/login-action@v4 зафиксирована по SHA (v4.6.0)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # используется секрет из CI вместо хардкода
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка backend-образа
        # версия docker-build-push-action@v7 зафиксирована по SHA (v7.4.0)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./backend/Dockerfile.backend
          load: true
          # Новый образ сохраняется с тегом sha коммита и как latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          # Имеется кеширование gha
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Сборка frontend-образа
        # версия docker-build-push-action@v7 зафиксирована по SHA (v7.4.0)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./frontend/Dockerfile.frontend
          load: true
          # Новый образ сохраняется с тегом sha коммита и как latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          # Кеширования нет, так как в таком случае из-за обновления пакетов при
          # сборке образа слой с RUN apk upgrade может быть взят из кеша, что может
          # оставить уязвимости в зависимостях

      - name: Сканирование backend-образа через Trivy
        # версия trivy-action@v0.36.0 зафиксирована по SHA (v0.36.0)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with: 
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          # Trivy падает на уязвимостях CRITICAL
          severity: 'CRITICAL'

      - name: Сканирование frontend-образа через Trivy
        # версия trivy-action@v0.36.0 зафиксирована по SHA (v0.36.0)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with: 
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          # Trivy падает на уязвимостях CRITICAL
          severity: 'CRITICAL'

      - name: Пуш backend-образа
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Пуш frontend-образа
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

  run-and-verify:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      # Тег предыдущего (рабочего) коммита
      previous_tag: ${{ steps.prev.outputs.previous }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: lab3-ci/cd
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Запомнить предыдущую версию (до деплоя)
        id: prev
        run: |
          mkdir -p .deploy
          if [ -f "${{ env.RELEASE_STATE_FILE }}" ]; then
            PREV=$(tr -d '\n' < "${{ env.RELEASE_STATE_FILE }}")
          else
            PREV="${{ github.sha }}"
          fi
          echo "previous=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Подготовка .env для docker compose
        run: |
          cat > .env <<EOF
          GHCR_REPO=foxene/devops-labs
          IMAGE_TAG=${{ github.sha }}
          POSTGRES_DB=notesdb
          POSTGRES_USER=notes
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          BACKEND_PORT=8000
          FRONTEND_PORT=8080
          EOF

      - name: Логин в GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Запуск приложения
        run: |
          docker compose pull
          docker compose up -d --wait
          docker compose ps

      - name: Проверка доступности сервисов
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            http://localhost:8080/healthz -o /dev/null
          echo "Frontend доступен"

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            http://localhost:8000/api/health
          echo "Backend доступен"

      - name: Зафиксировать новую рабочую версию
        run: |
          echo "${{ github.sha }}" > "${{ env.RELEASE_STATE_FILE }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.RELEASE_STATE_FILE }}"
          git commit -m "chore(deploy): release ${{ github.sha }}" || echo "no changes"
          git push origin HEAD:lab3-ci/cd

      - name: Остановка
        if: always()
        run: docker compose down || true
  
  # Job для автоматического отката к стабильной версии
  auto-rollback:
    needs: run-and-verify
    # Запустится, даже если приложение не отвечает
    if: always() && needs.run-and-verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: lab3-ci/cd
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Определить целевой тег отката
        id: target
        run: |
          TARGET="${{ needs.run-and-verify.outputs.previous_tag }}"
          if [ -z "$TARGET" ] && [ -f "${{ env.RELEASE_STATE_FILE }}" ]; then
            TARGET=$(tr -d '\n' < "${{ env.RELEASE_STATE_FILE }}")
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::Нет предыдущей версии для отката"
            exit 1
          fi
          echo "tag=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "Авто-откат на SHA: ${TARGET}"

      - name: Логин в GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовка .env для отката
        run: |
          cat > .env <<EOF
          GHCR_REPO=foxene/devops-labs
          IMAGE_TAG=${{ steps.target.outputs.tag }}
          POSTGRES_DB=notesdb
          POSTGRES_USER=notes
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          BACKEND_PORT=8000
          FRONTEND_PORT=8080
          EOF

      - name: Откат + замер времени
        id: rollback
        run: |
          START_TIME=$(date +%s)
          docker compose pull
          docker compose up -d --wait
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "rollback_seconds=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "Авто-откат занял ${DURATION} секунд"

      - name: Проверка, что сервис снова жив (curl)
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            http://localhost:8080/healthz -o /dev/null
          echo "Frontend отвечает после отката"
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            http://localhost:8000/api/health
          echo "Backend отвечает после отката"

      - name: Вернуть state-файл на откатанную версию
        run: |
          echo "${{ steps.target.outputs.tag }}" > "${{ env.RELEASE_STATE_FILE }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.RELEASE_STATE_FILE }}"
          git commit -m "chore(rollback): auto-revert to ${{ steps.target.outputs.tag }}" || echo "no changes"
          git push origin HEAD:lab3-ci/cd

      - name: Остановка контейнеров после отката
        if: always()
        run: docker compose down -v || true

