limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1r/s;
limit_req_status 429;

upstream backend_cluster {
    server 127.0.0.1:8080 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=10s;
}

# HTTP -> HTTPS для local.project
server {
    listen 80;
    server_name local.project;
    return 301 https://$host$request_uri;
}

# HTTP -> HTTPS для second.project
server {
    listen 80;
    server_name second.project;
    return 301 https://$host$request_uri;
}

# Основной сайт
server {
    listen 443 ssl;
    server_name local.project;

    ssl_certificate     /etc/nginx/ssl/local.project.crt;
    ssl_certificate_key /etc/nginx/ssl/local.project.key;

    root /var/www/coud-labs/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        alias /var/www/coud-labs/docs/;
        index index.html;
    }

    location /admin/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://backend_cluster;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/coud-labs;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/coud-labs;
        internal;
    }
}

# Второй виртуальный хост
server {
    listen 443 ssl;
    server_name second.project;

    ssl_certificate     /etc/nginx/ssl/second.project.crt;
    ssl_certificate_key /etc/nginx/ssl/second.project.key;

    root /var/www/second-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
