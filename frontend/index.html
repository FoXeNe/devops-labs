<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Lab 0 — Notes</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 640px;
      margin: 48px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    h1 { margin-bottom: 4px; }
    .sub { opacity: .6; margin-top: 0; }
    form { display: flex; gap: 8px; margin: 24px 0; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #8884;
      border-radius: 8px;
      background: transparent;
      color: inherit;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    ul { list-style: none; padding: 0; }
    li {
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid #8883;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    li time { opacity: .5; font-size: 13px; white-space: nowrap; }
    .empty { opacity: .5; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Notes</h1>
  <p class="sub">FastAPI + PostgreSQL</p>

  <form id="form">
    <input id="text" type="text" placeholder="Напиши что-нибудь..." maxlength="500" required />
    <button id="submit" type="submit">Добавить</button>
  </form>

  <p id="status" class="empty">Загрузка...</p>
  <ul id="list"></ul>

  <script>
    const API_BASE =
      location.protocol === "file:" ? "http://localhost:5000" : "";

    const form = document.getElementById("form");
    const input = document.getElementById("text");
    const submit = document.getElementById("submit");
    const list = document.getElementById("list");
    const status = document.getElementById("status");

    async function loadItems() {
      status.textContent = "Загрузка...";
      status.className = "empty";
      try {
        const res = await fetch(`${API_BASE}/api/items`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const items = await res.json();
        render(items);
      } catch (err) {
        status.textContent = `Ошибка загрузки: ${err.message}`;
        status.className = "error";
      }
    }

    function render(items) {
      list.innerHTML = "";
      if (items.length === 0) {
        status.textContent = "Пока пусто. Добавь первую запись.";
        status.className = "empty";
        return;
      }
      status.textContent = `Записей: ${items.length}`;
      status.className = "empty";
      for (const item of items) {
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = item.text;
        const time = document.createElement("time");
        time.textContent = new Date(item.created_at).toLocaleString();
        li.append(span, time);
        list.append(li);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      submit.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/api/items`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        input.value = "";
        await loadItems();
      } catch (err) {
        status.textContent = `Ошибка сохранения: ${err.message}`;
        status.className = "error";
      } finally {
        submit.disabled = false;
        input.focus();
      }
    });

    loadItems();
  </script>
</body>
</html>
